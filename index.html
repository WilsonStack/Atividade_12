<!DOCTYPE html>
<html>
<head>
  <title>Exemplo de Tabela</title>
</head>
<body>

  <h1>Exemplo de Tabela</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Profissão</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ana</td>
        <td>25</td>
        <td>Engenheira</td>
      </tr>
      <tr>
        <td>João</td>
        <td>30</td>
        <td>Professor</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
